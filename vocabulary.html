<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxelMD — Vocabulary Hub</title>
<script>if(localStorage.getItem('voxelTheme')==='dark')document.documentElement.className='dark';</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F3; --surface: #fff; --surface2: #F0EFEB;
  --border: rgba(0,0,0,0.08); --border-md: rgba(0,0,0,0.13);
  --text: #1A1A1A; --text-2: #6B6B6B; --text-3: #ADADAD;
  --teal: #1D9E75; --teal-light: #E1F5EE; --teal-mid: #5DCAA5; --teal-dark: #179164;
  --amber: #BA7517; --red: #D94040;
  --purple: #534AB7; --purple-light: #EEEDFE;
  --radius: 8px; --radius-lg: 12px; --sidebar: 224px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; height: 100vh;
}
.sb-header { padding: 16px 14px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; cursor: pointer; }
.logo-icon { width: 28px; height: 28px; background: var(--teal); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-icon svg { width: 14px; height: 14px; }
.logo-text { font-size: 15px; font-weight: 500; letter-spacing: -0.3px; }
.logo-text em { color: var(--teal); font-style: normal; }

.sb-user-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: var(--radius); cursor: pointer; transition: background 0.12s; }
.sb-user-row:hover { background: var(--surface2); }
.sb-user-row .avatar { width: 24px; height: 24px; font-size: 9px; }
.sb-user-row-info { flex: 1; min-width: 0; }
.sb-user-row-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-row-plan { font-size: 10px; color: var(--text-3); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--purple-light); color: var(--purple); font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.sb-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.sb-body::-webkit-scrollbar { width: 3px; }
.sb-body::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }

.sb-back-btn {
  display: flex; align-items: center; gap: 7px;
  width: calc(100% - 20px); margin: 4px 10px 8px;
  padding: 7px 10px; background: none; border: none;
  border-radius: var(--radius); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text-2);
  transition: background 0.12s;
}
.sb-back-btn:hover { background: var(--surface2); }
.sb-back-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

.sb-section-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; padding: 6px 14px 4px; }
.sb-divider { height: 1px; background: var(--border); margin: 6px 10px; }

/* Stats */
.sb-stats { padding: 4px 10px 8px; }
.sb-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sb-stat { background: var(--bg); border-radius: var(--radius); padding: 8px 10px; }
.sb-stat-num { font-size: 20px; font-weight: 500; color: var(--text); line-height: 1; margin-bottom: 3px; }
.sb-stat-num.teal   { color: var(--teal); }
.sb-stat-num.purple { color: var(--purple); }
.sb-stat-num.amber  { color: var(--amber); }
.sb-stat-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }

/* Article filter */
.sb-article-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 14px; cursor: pointer; font-size: 12px; color: var(--text-2);
  transition: background 0.1s;
}
.sb-article-item:hover { background: var(--bg); }
.sb-article-item.active { background: var(--teal-light); color: var(--teal); }
.sb-article-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.3; flex-shrink: 0; }
.sb-article-item.active .sb-article-dot { opacity: 1; }
.sb-article-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-article-count { font-size: 10px; background: var(--surface2); color: var(--text-3); border-radius: 10px; padding: 1px 5px; flex-shrink: 0; }
.sb-article-item.active .sb-article-count { background: rgba(29,158,117,0.15); color: var(--teal); }

/* Expiring soon */
.expiring-item { display: flex; align-items: center; gap: 8px; padding: 5px 14px; }
.expiring-word { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.expiring-pill { font-size: 10px; color: var(--red); background: rgba(217,64,64,0.1); padding: 1px 6px; border-radius: 8px; flex-shrink: 0; white-space: nowrap; }
.expiring-none { padding: 8px 14px; font-size: 12px; color: var(--text-3); }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px;
}
.topbar-left h1 { font-size: 17px; font-weight: 500; letter-spacing: -0.3px; }
.topbar-left p { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.tb-btn { display: flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--border-md); border-radius: var(--radius); background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text-2); cursor: pointer; transition: background 0.12s; }
.tb-btn:hover { background: var(--surface2); }
.tb-btn svg { width: 12px; height: 12px; }

.search-topbar { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; transition: border-color 0.15s; }
.search-topbar:focus-within { border-color: var(--teal-mid); }
.search-topbar svg { width: 13px; height: 13px; color: var(--text-3); flex-shrink: 0; }
.search-topbar input { background: none; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text); width: 180px; }
.search-topbar input::placeholder { color: var(--text-3); }

.theme-toggle { width: 36px; height: 20px; background: var(--surface2); border: 1px solid var(--border-md); border-radius: 10px; cursor: pointer; position: relative; padding: 0; transition: background .2s, border-color .2s; flex-shrink: 0; }
.theme-toggle::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--text-3); top: 2px; left: 2px; transition: transform .2s, background .2s; }
html.dark .theme-toggle { background: rgba(29,158,117,0.15); border-color: var(--teal-mid); }
html.dark .theme-toggle::after { transform: translateX(16px); background: var(--teal); }
.theme-sun-icon { width: 13px; height: 13px; color: var(--amber); flex-shrink: 0; opacity: 0.8; }

/* ── VOCAB CONTENT ── */
.vocab-content { flex: 1; display: flex; overflow: hidden; }
.vocab-zone { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.vocab-zone + .vocab-zone { border-left: 1px solid var(--border); }
.zone-header { padding: 14px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.zone-header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.zone-title { font-size: 13px; font-weight: 500; letter-spacing: -0.2px; }
.zone-badge { font-size: 10px; background: var(--surface2); color: var(--text-3); border-radius: 10px; padding: 2px 7px; }
.zone-hint { font-size: 11px; color: var(--text-3); }

.zone-cards {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start;
  transition: background 0.15s, outline 0.15s;
}
.zone-cards::-webkit-scrollbar { width: 4px; }
.zone-cards::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }
.zone-cards.drag-over { background: var(--teal-light); outline: 2px dashed var(--teal-mid); outline-offset: -10px; border-radius: var(--radius); }

/* ── VOCAB CARD ── */
.vocab-card {
  width: 160px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 12px 10px;
  cursor: grab; transition: all 0.15s; position: relative; overflow: hidden;
  user-select: none;
}
.vocab-card:hover { border-color: var(--border-md); box-shadow: 0 4px 16px rgba(0,0,0,0.07); transform: translateY(-1px); }
.vocab-card.dragging { opacity: 0.35; cursor: grabbing; transform: none; box-shadow: none; }
.vocab-card:active { cursor: grabbing; }

.vc-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
.vc-word { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.3; flex: 1; min-width: 0; }
.vc-days { font-size: 9px; font-weight: 500; padding: 2px 6px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; margin-left: 4px; margin-top: 2px; }
.vc-days.d-ok   { background: var(--teal-light); color: var(--teal-dark); }
.vc-days.d-mid  { background: rgba(186,117,23,0.12); color: var(--amber); }
.vc-days.d-soon { background: rgba(217,64,64,0.1); color: var(--red); }

.vc-phonetic { font-size: 11px; color: var(--text-3); font-family: 'DM Mono', monospace; margin-bottom: 12px; line-height: 1.4; }
.vc-footer { display: flex; align-items: center; gap: 2px; }
.vc-btn { width: 22px; height: 22px; border: none; background: none; cursor: pointer; color: var(--text-3); border-radius: 5px; display: flex; align-items: center; justify-content: center; transition: background 0.1s, color 0.1s; flex-shrink: 0; }
.vc-btn:hover { background: var(--surface2); color: var(--text-2); }
.vc-btn.danger:hover { background: rgba(217,64,64,0.1); color: var(--red); }
.vc-btn svg { width: 11px; height: 11px; }
.vc-spacer { flex: 1; }

.vc-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
.vc-progress-fill { height: 100%; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

/* Empty state */
.zone-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 40px 20px; gap: 10px; color: var(--text-3); text-align: center; }
.zone-empty svg { width: 40px; height: 40px; opacity: 0.25; }
.zone-empty p { font-size: 13px; font-weight: 500; }
.zone-empty span { font-size: 12px; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: white; font-size: 13px; padding: 8px 16px; border-radius: var(--radius); opacity: 0; transition: all 0.25s; z-index: 999; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── DARK MODE ── */
html.dark {
  --bg: #1C1B19; --surface: #242321; --surface2: #2E2C2A;
  --border: rgba(255,255,255,0.07); --border-md: rgba(255,255,255,0.12);
  --text: #E8E6E1; --text-2: #9A9891; --text-3: #575451;
  --teal-light: rgba(29,158,117,0.18); --purple-light: rgba(83,74,183,0.18);
}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<div class="sidebar">
  <div class="sb-header">
    <div class="logo-row" id="logoRow">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="8" height="8" rx="1.5" fill="white" opacity="0.95"/>
          <rect x="13" y="3" width="8" height="8" rx="1.5" fill="white" opacity="0.6"/>
          <rect x="3" y="13" width="8" height="8" rx="1.5" fill="white" opacity="0.6"/>
          <rect x="13" y="13" width="8" height="8" rx="1.5" fill="white" opacity="0.3"/>
        </svg>
      </div>
      <div class="logo-text">Voxel<em>MD</em></div>
    </div>
    <div class="sb-user-row" id="sbUserRow">
      <div class="avatar" id="sbAvatar">WW</div>
      <div class="sb-user-row-info">
        <div class="sb-user-row-name" id="sbUserName">William Wu</div>
        <div class="sb-user-row-plan">Free Plan</div>
      </div>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="width:10px;height:10px;color:var(--text-3);flex-shrink:0;"><polyline points="6,4 10,8 6,12"/></svg>
    </div>
  </div>

  <div class="sb-body">
    <button class="sb-back-btn" id="backBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="10,4 6,8 10,12"/></svg>
      My Workspaces
    </button>

    <div class="sb-divider"></div>

    <div class="sb-section-label">Overview</div>
    <div class="sb-stats">
      <div class="sb-stats-grid" id="statsGrid"></div>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-section-label">Filter by Article</div>
    <div id="articleFilterList"></div>

    <div class="sb-divider"></div>

    <div class="sb-section-label">Expiring Soon</div>
    <div id="expiringSoon"></div>
  </div>
</div>

<!-- ── MAIN ── -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Vocabulary Hub</h1>
      <p id="topSubtitle">Loading…</p>
    </div>
    <div class="topbar-right">
      <div class="search-topbar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        <input type="text" id="searchInput" placeholder="Search words…">
      </div>
      <svg class="theme-sun-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="3"/>
        <line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/>
        <line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/>
        <line x1="3.3" y1="3.3" x2="4.6" y2="4.6"/><line x1="11.4" y1="11.4" x2="12.7" y2="12.7"/>
        <line x1="12.7" y1="3.3" x2="11.4" y2="4.6"/><line x1="4.6" y1="11.4" x2="3.3" y2="12.7"/>
      </svg>
      <button class="theme-toggle" id="themeToggle" title="Toggle dark mode"></button>
      <button class="tb-btn" id="logoutBtn" title="Sign out" style="padding:7px 10px;">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 14H3a1 1 0 01-1-1V3a1 1 0 011-1h3"/><polyline points="11,11 14,8 11,5"/><line x1="14" y1="8" x2="6" y2="8"/></svg>
      </button>
    </div>
  </div>

  <div class="vocab-content">
    <div class="vocab-zone" id="practiceZone">
      <div class="zone-header">
        <div class="zone-header-top">
          <span class="zone-title">Practice</span>
          <span class="zone-badge" id="practiceCount">0</span>
        </div>
        <div class="zone-hint">New and actively learning words. Drag to Review when ready.</div>
      </div>
      <div class="zone-cards" id="practiceCards"></div>
    </div>

    <div class="vocab-zone" id="reviewZone">
      <div class="zone-header">
        <div class="zone-header-top">
          <span class="zone-title">Review</span>
          <span class="zone-badge" id="reviewCount">0</span>
        </div>
        <div class="zone-hint">Cards expire after 7 days and count as mastered.</div>
      </div>
      <div class="zone-cards" id="reviewCards"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var NOW = Date.now();
var DAY = 86400000;

var DEMO_DATA = [
  { id:1,  word:'ephemeral',      phonetic:'/ɪˈfɛm.ər.əl/',          articleId:1, articleName:'The Power of Vulnerability', zone:'practice', addedAt:NOW-3*DAY,  reviewedAt:null },
  { id:2,  word:'vulnerability',  phonetic:'/ˌvʌl.nər.əˈbɪl.ɪ.ti/', articleId:1, articleName:'The Power of Vulnerability', zone:'practice', addedAt:NOW-2*DAY,  reviewedAt:null },
  { id:3,  word:'authentic',      phonetic:'/ɔːˈθen.tɪk/',           articleId:1, articleName:'The Power of Vulnerability', zone:'review',   addedAt:NOW-10*DAY, reviewedAt:NOW-5*DAY },
  { id:4,  word:'compassion',     phonetic:'/kəmˈpæʃ.ən/',           articleId:1, articleName:'The Power of Vulnerability', zone:'practice', addedAt:NOW-1*DAY,  reviewedAt:null },
  { id:5,  word:'differentiate',  phonetic:'/ˌdɪf.ərˈen.ʃi.eɪt/',   articleId:2, articleName:'Start With Why',             zone:'practice', addedAt:NOW-4*DAY,  reviewedAt:null },
  { id:6,  word:'proprietary',    phonetic:'/prəˈpraɪ.ə.ter.i/',     articleId:2, articleName:'Start With Why',             zone:'practice', addedAt:NOW-1*DAY,  reviewedAt:null },
  { id:7,  word:'neocortex',      phonetic:'/ˌniː.oʊˈkɔːr.teks/',    articleId:2, articleName:'Start With Why',             zone:'review',   addedAt:NOW-8*DAY,  reviewedAt:NOW-6*DAY },
  { id:8,  word:'limbic',         phonetic:'/ˈlɪm.bɪk/',             articleId:2, articleName:'Start With Why',             zone:'review',   addedAt:NOW-9*DAY,  reviewedAt:NOW-1*DAY },
  { id:9,  word:'testosterone',   phonetic:'/tesˈtɒs.tər.oʊn/',      articleId:3, articleName:'Your Body Language',         zone:'practice', addedAt:NOW-5*DAY,  reviewedAt:null },
  { id:10, word:'cortisol',       phonetic:'/ˈkɔːr.tɪ.sɒl/',         articleId:3, articleName:'Your Body Language',         zone:'practice', addedAt:NOW-6*DAY,  reviewedAt:null },
  { id:11, word:'nonverbal',      phonetic:'/nɒnˈvɜːr.bəl/',         articleId:3, articleName:'Your Body Language',         zone:'review',   addedAt:NOW-12*DAY, reviewedAt:NOW-2*DAY },
  { id:12, word:'hierarchy',      phonetic:'/ˈhaɪ.ər.ɑːr.ki/',       articleId:2, articleName:'Start With Why',             zone:'practice', addedAt:NOW-7*DAY,  reviewedAt:null }
];

var masteredCount = 14;

function loadCards() {
  var raw = localStorage.getItem('voxelVocab');
  if (!raw) { localStorage.setItem('voxelVocab', JSON.stringify(DEMO_DATA)); return DEMO_DATA.slice(); }
  try { return JSON.parse(raw); } catch(e) { return DEMO_DATA.slice(); }
}
function saveCards() { localStorage.setItem('voxelVocab', JSON.stringify(cards)); }

var cards = loadCards();

// Expire review cards older than 7 days → count as mastered
(function processExpired() {
  var changed = false;
  cards = cards.filter(function(c) {
    if (c.zone === 'review' && c.reviewedAt && (NOW - c.reviewedAt) >= 7 * DAY) {
      masteredCount++;
      changed = true;
      return false;
    }
    return true;
  });
  if (changed) saveCards();
})();

var filterArticleId = null;
var searchQuery = '';

function daysLeft(card) {
  if (!card.reviewedAt) return null;
  var msLeft = 7 * DAY - (NOW - card.reviewedAt);
  return Math.max(0, Math.ceil(msLeft / DAY));
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getFiltered() {
  return cards.filter(function(c) {
    if (filterArticleId !== null && c.articleId !== filterArticleId) return false;
    if (searchQuery && c.word.toLowerCase().indexOf(searchQuery) === -1) return false;
    return true;
  });
}

// ── RENDER ──

function render() {
  var filtered = getFiltered();
  var practice = filtered.filter(function(c) { return c.zone === 'practice'; });
  var review   = filtered.filter(function(c) { return c.zone === 'review'; });
  renderZone('practiceCards', 'practiceCount', practice, 'practice');
  renderZone('reviewCards',   'reviewCount',   review,   'review');
  renderSidebar();
  updateSubtitle();
}

function updateSubtitle() {
  var p = cards.filter(function(c){ return c.zone==='practice'; }).length;
  var r = cards.filter(function(c){ return c.zone==='review'; }).length;
  document.getElementById('topSubtitle').textContent =
    (p + r) + ' words · ' + r + ' in review · ' + masteredCount + ' mastered';
}

function renderZone(containerId, countId, zoneCards, zone) {
  document.getElementById(countId).textContent = zoneCards.length;
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!zoneCards.length) {
    var empty = document.createElement('div');
    empty.className = 'zone-empty';
    if (zone === 'practice') {
      empty.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">' +
          '<rect x="2" y="3" width="20" height="16" rx="2"/>' +
          '<line x1="7" y1="21" x2="17" y2="21"/><line x1="12" y1="19" x2="12" y2="21"/>' +
        '</svg>' +
        '<p>No practice words</p>' +
        '<span>Add words from an article to get started</span>';
    } else {
      empty.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">' +
          '<path d="M9 11l3 3L22 4"/>' +
          '<path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>' +
        '</svg>' +
        '<p>No words in review</p>' +
        '<span>Drag words from Practice when you\'re ready</span>';
    }
    container.appendChild(empty);
    return;
  }
  zoneCards.forEach(function(card) { container.appendChild(makeCard(card)); });
}

function makeCard(card) {
  var dl = daysLeft(card);
  var dayClass = '', dayLabel = '';
  if (dl !== null) {
    if (dl >= 4)      { dayClass = 'd-ok';   dayLabel = dl + 'd left'; }
    else if (dl >= 2) { dayClass = 'd-mid';  dayLabel = dl + 'd left'; }
    else              { dayClass = 'd-soon'; dayLabel = dl === 1 ? '1d left' : 'Today'; }
  }

  var progressHtml = '';
  if (dl !== null) {
    var pct    = Math.min(100, Math.round((dl / 7) * 100));
    var pColor = dl >= 4 ? 'var(--teal)' : dl >= 2 ? 'var(--amber)' : 'var(--red)';
    progressHtml = '<div class="vc-progress"><div class="vc-progress-fill" style="width:' + pct + '%;background:' + pColor + '"></div></div>';
  }

  var el = document.createElement('div');
  el.className = 'vocab-card';
  el.draggable = true;
  el.dataset.id = String(card.id);
  el.innerHTML =
    '<div class="vc-top">' +
      '<div class="vc-word">' + esc(card.word) + '</div>' +
      (dl !== null ? '<span class="vc-days ' + dayClass + '">' + esc(dayLabel) + '</span>' : '') +
    '</div>' +
    '<div class="vc-phonetic">' + esc(card.phonetic) + '</div>' +
    '<div class="vc-footer">' +
      '<button class="vc-btn source-btn" title="' + esc(card.articleName) + '">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1V9"/><polyline points="10,1 15,1 15,6"/><line x1="15" y1="1" x2="7" y2="9"/></svg>' +
      '</button>' +
      '<div class="vc-spacer"></div>' +
      '<button class="vc-btn danger del-btn" title="Delete word">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><polyline points="3,5 13,5"/><path d="M6 5V3h4v2"/><path d="M4 5l1 8h6l1-8"/></svg>' +
      '</button>' +
    '</div>' +
    progressHtml;

  // Click to pronounce (skip button clicks)
  el.addEventListener('click', function(e) {
    if (e.target.closest('.vc-btn')) return;
    playWord(card.word);
  });

  // Drag
  el.addEventListener('dragstart', function(e) {
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(card.id));
  });
  el.addEventListener('dragend', function() { el.classList.remove('dragging'); });

  // Buttons
  el.querySelector('.source-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    toast('From: ' + card.articleName);
  });
  el.querySelector('.del-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    var w = card.word;
    cards = cards.filter(function(c) { return c.id !== card.id; });
    saveCards();
    render();
    toast('"' + w + '" deleted');
  });

  return el;
}

// ── DRAG & DROP ──
function setupZoneDrop(zoneCardsId, targetZone) {
  var el = document.getElementById(zoneCardsId);
  el.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('drag-over');
  });
  el.addEventListener('dragleave', function(e) {
    if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
  });
  el.addEventListener('drop', function(e) {
    e.preventDefault();
    el.classList.remove('drag-over');
    var id = parseInt(e.dataTransfer.getData('text/plain'), 10);
    var card = cards.find(function(c) { return c.id === id; });
    if (!card || card.zone === targetZone) return;
    card.zone = targetZone;
    card.reviewedAt = targetZone === 'review' ? Date.now() : null;
    saveCards();
    render();
    toast(targetZone === 'review'
      ? '"' + card.word + '" moved to Review'
      : '"' + card.word + '" moved back to Practice');
  });
}
setupZoneDrop('practiceCards', 'practice');
setupZoneDrop('reviewCards',   'review');

// ── SIDEBAR ──
function renderSidebar() {
  renderStats();
  renderArticleFilter();
  renderExpiringSoon();
}

function renderStats() {
  var p = cards.filter(function(c){ return c.zone==='practice'; }).length;
  var r = cards.filter(function(c){ return c.zone==='review'; }).length;
  document.getElementById('statsGrid').innerHTML =
    stat(p + r, 'Total',    '') +
    stat(p,     'Practice', 'teal') +
    stat(r,     'Review',   'purple') +
    stat(masteredCount, 'Mastered', 'amber');
}
function stat(n, label, cls) {
  return '<div class="sb-stat"><div class="sb-stat-num' + (cls ? ' '+cls : '') + '">' + n + '</div><div class="sb-stat-label">' + label + '</div></div>';
}

function renderArticleFilter() {
  var list = document.getElementById('articleFilterList');
  var map = {};
  cards.forEach(function(c) {
    if (!map[c.articleId]) map[c.articleId] = { id: c.articleId, name: c.articleName, count: 0 };
    map[c.articleId].count++;
  });
  var articles = Object.keys(map).map(function(k) { return map[k]; });
  list.innerHTML = '';
  articles.forEach(function(a) {
    var item = document.createElement('div');
    item.className = 'sb-article-item' + (filterArticleId === a.id ? ' active' : '');
    item.innerHTML =
      '<div class="sb-article-dot"></div>' +
      '<div class="sb-article-name">' + esc(a.name) + '</div>' +
      '<span class="sb-article-count">' + a.count + '</span>';
    item.addEventListener('click', function() {
      filterArticleId = filterArticleId === a.id ? null : a.id;
      render();
    });
    list.appendChild(item);
  });
}

function renderExpiringSoon() {
  var el = document.getElementById('expiringSoon');
  var soon = cards.filter(function(c) {
    return c.zone === 'review' && c.reviewedAt && daysLeft(c) <= 2;
  });
  el.innerHTML = '';
  if (!soon.length) {
    el.innerHTML = '<div class="expiring-none">No words expiring soon</div>';
    return;
  }
  soon.forEach(function(card) {
    var dl = daysLeft(card);
    var item = document.createElement('div');
    item.className = 'expiring-item';
    item.innerHTML =
      '<div class="expiring-word">' + esc(card.word) + '</div>' +
      '<span class="expiring-pill">' + dl + 'd</span>';
    el.appendChild(item);
  });
}

// ── TTS ──
function playWord(word) {
  if (!window.speechSynthesis) { toast('TTS not available in this browser'); return; }
  var u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.toLowerCase().trim();
  render();
});

// ── THEME ──
document.getElementById('themeToggle').addEventListener('click', function() {
  var isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('voxelTheme', isDark ? 'dark' : 'light');
});

// ── NAV ──
document.getElementById('logoutBtn').addEventListener('click', function() {
  localStorage.removeItem('voxelUser');
  window.location.href = 'login.html';
});
document.getElementById('backBtn').addEventListener('click', function() { window.location.href = 'home.html'; });
document.getElementById('logoRow').addEventListener('click', function() { window.location.href = 'home.html'; });
document.getElementById('sbUserRow').addEventListener('click', function() { window.location.href = 'profile.html'; });

// ── USER INIT ──
(function initUser() {
  var raw = localStorage.getItem('voxelUser');
  if (!raw) { window.location.href = 'login.html'; return; }
  var user = JSON.parse(raw);
  var initials = user.name.split(' ').map(function(p){ return p[0]||''; }).join('').slice(0,2).toUpperCase() || '??';
  document.getElementById('sbAvatar').textContent = initials;
  document.getElementById('sbUserName').textContent = user.name;
  if (user.avatarUrl) {
    var el = document.getElementById('sbAvatar');
    el.textContent = '';
    el.style.backgroundImage = 'url(' + user.avatarUrl + ')';
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
  }
})();


// ── TOAST ──
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2400);
}

render();
</script>
